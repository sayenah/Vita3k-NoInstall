name: Update from upstream

# Rebases this fork's patches (no-install play + library UI) onto a newer upstream
# Vita3K, then triggers a build. On a clean rebase you get a fresh Release (APK +
# Windows zip). On a code conflict it opens an Issue instead and does not push --
# that's the signal a developer needs to resolve it locally.
#
#   * "Run workflow" button (Actions tab) -- pick the upstream branch/tag to track.
#   * Weekly auto-check (Mondays). Delete the `schedule:` block to turn that off.

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream branch or tag to update to (e.g. master, v0.2.2)"
        required: false
        default: "master"
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC

permissions:
  contents: write # push the rebased branch + backup branches
  actions: write # trigger the Build CI workflow
  issues: write # file an issue when a rebase needs a human

concurrency:
  group: update-from-upstream
  cancel-in-progress: false

env:
  # Files the fork replaces wholesale. When upstream edits one of these, the rebase keeps the
  # fork's version instead of stopping. Anything else that conflicts still needs a human.
  FORK_OWNED_FILES: README.md
  ISSUE_TITLE_PREFIX: "Upstream update needs"
  # GitHub refuses GITHUB_TOKEN pushes that touch .github/workflows/, which upstream's CI commits
  # do. A fine-grained PAT (this repo; Contents + Workflows: read/write) saved as the
  # UPSTREAM_SYNC_TOKEN secret lets those updates through. Pushes made with it trigger Build CI
  # on their own, so the explicit dispatch below is only used without it.
  HAS_SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN != '' }}

jobs:
  rebase-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork (full history)
        uses: actions/checkout@v7
        with:
          ref: feature/game-bundle
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}

      - name: Configure git identity
        run: |
          git config user.name "vita3k-noinstall-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Rebase onto upstream
        id: rebase
        run: |
          REF="${{ github.event.inputs.upstream_ref || 'master' }}"
          git remote add upstream https://github.com/Vita3K/Vita3K.git 2>/dev/null || \
            git remote set-url upstream https://github.com/Vita3K/Vita3K.git
          git fetch upstream --tags --prune
          if git rev-parse --verify "upstream/$REF" >/dev/null 2>&1; then TARGET="upstream/$REF"; else TARGET="$REF"; fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          ORIG=$(git rev-parse HEAD)
          echo "orig=$ORIG" >> "$GITHUB_OUTPUT"
          echo "Target: $TARGET"

          # On the weekly auto-run, do nothing if upstream has not moved past what we're built on.
          if [ "${{ github.event_name }}" = "schedule" ] && git merge-base --is-ancestor "$TARGET" HEAD; then
            echo "Already up to date with $TARGET -- skipping."
            echo "status=uptodate" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          status=ok
          if ! git rebase "$TARGET"; then
            while :; do
              conflicted=$(git diff --name-only --diff-filter=U)
              needs_human=$(printf '%s\n' $conflicted | grep -vxF -f <(printf '%s\n' $FORK_OWNED_FILES) || true)
              if [ -z "$conflicted" ] || [ -n "$needs_human" ]; then
                echo "Conflicts needing a human: ${needs_human:-<rebase stopped without file conflicts>}"
                { echo "conflicts<<EOF"; echo "${needs_human:-<rebase stopped without file conflicts>}"; echo "EOF"; } >> "$GITHUB_OUTPUT"
                git rebase --abort || true
                status=conflict
                break
              fi
              # During a rebase "theirs" is the fork commit being replayed, i.e. the fork's version.
              for f in $conflicted; do
                echo "Keeping fork's version of $f"
                if git checkout --theirs -- "$f" 2>/dev/null; then git add -- "$f"; else git rm -q -- "$f"; fi
              done
              if GIT_EDITOR=true git rebase --continue; then break; fi
            done
          fi
          if [ "$status" = ok ] && [ "$(git rev-parse HEAD)" = "$ORIG" ]; then
            echo "Already up to date with $TARGET -- nothing to push."
            status=uptodate
          elif [ "$status" = ok ] && [ "$HAS_SYNC_TOKEN" != true ] && \
             ! git diff --quiet "$ORIG" HEAD -- .github/workflows; then
            echo "::error::Upstream changed .github/workflows/, which GITHUB_TOKEN may not push. Add the UPSTREAM_SYNC_TOKEN secret."
            status=needs-token
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Push rebased branch
        if: steps.rebase.outputs.status == 'ok'
        run: |
          # Safety snapshot of the pre-rebase tip, pushed atomically with the rewrite so a rejected
          # push leaves no stray backup. --force-with-lease refuses to clobber anything pushed to the
          # branch while this job was running.
          BACKUP="backup/auto-$(date +%Y%m%d-%H%M%S)"
          git push --atomic --force-with-lease="feature/game-bundle:${{ steps.rebase.outputs.orig }}" origin \
            "${{ steps.rebase.outputs.orig }}:refs/heads/$BACKUP" HEAD:feature/game-bundle
          echo "Backup pushed: $BACKUP"

      - name: Trigger a build of the updated code
        if: steps.rebase.outputs.status == 'ok' && env.HAS_SYNC_TOKEN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GITHUB_TOKEN pushes don't auto-trigger Build CI, so dispatch it explicitly against
          # the freshly-pushed branch tip. Build CI publishes the "latest" Release itself, in the
          # same run (see the publish-noinstall-release job) — no separate publish workflow to be
          # suppressed by the GITHUB_TOKEN anti-recursion rule.
          gh workflow run c-cpp.yml --ref feature/game-bundle -R "${{ github.repository }}"
          echo "Rebased onto ${{ steps.rebase.outputs.target }} and started a build."
          echo "A new Release (APK + Windows zip) will appear when the build finishes."

      - name: Close conflict issues that are now resolved
        if: steps.rebase.outputs.status == 'ok' || steps.rebase.outputs.status == 'uptodate'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list -R "${{ github.repository }}" --state open --search "\"$ISSUE_TITLE_PREFIX\" in:title" \
            --json number -q '.[].number' | while read -r n; do
            gh issue close "$n" -R "${{ github.repository }}" \
              --comment "Resolved: the fork now rebases cleanly onto \`${{ steps.rebase.outputs.target }}\` (run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          done

      - name: File an issue if the rebase needs a human
        if: steps.rebase.outputs.status == 'conflict' || steps.rebase.outputs.status == 'needs-token'
        env:
          GH_TOKEN: ${{ github.token }}
          CONFLICTS: ${{ steps.rebase.outputs.conflicts }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "${{ steps.rebase.outputs.status }}" = needs-token ]; then
            TITLE="$ISSUE_TITLE_PREFIX a token that can update workflows"
            BODY="Rebasing onto \`${{ steps.rebase.outputs.target }}\` succeeded, but upstream changed files under \`.github/workflows/\`, and GitHub does not let the built-in GITHUB_TOKEN push those. Nothing was pushed; the branch is unchanged.

          Fix once:
          1. Create a fine-grained personal access token at https://github.com/settings/personal-access-tokens/new, limited to this repository, with **Contents: Read and write** and **Workflows: Read and write**.
          2. Save it as the repository secret \`UPSTREAM_SYNC_TOKEN\` (Settings > Secrets and variables > Actions).
          3. Re-run **Update from upstream** from the Actions tab.

          Run: $RUN_URL"
          else
          TITLE="$ISSUE_TITLE_PREFIX manual conflict resolution"
          BODY="Automatic rebase of our patches onto \`${{ steps.rebase.outputs.target }}\` hit a merge conflict and was aborted (nothing was pushed; the branch is unchanged).

          Conflicting files:
          \`\`\`
          $CONFLICTS
          \`\`\`

          A developer resolves it locally:
          \`\`\`
          tools/update-from-upstream.sh ${{ github.event.inputs.upstream_ref || 'master' }}
          # fix the files it lists, then:
          git add <files>; git rebase --continue
          git push --force-with-lease origin feature/game-bundle
          \`\`\`
          Once pushed, a build runs and a new Release is published automatically.

          Run: $RUN_URL"
          fi

          # One open issue at a time: add a comment to the existing one instead of opening duplicates.
          EXISTING=$(gh issue list -R "${{ github.repository }}" --state open \
            --search "\"$ISSUE_TITLE_PREFIX\" in:title" --json number -q '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" -R "${{ github.repository }}" --body "Still conflicting as of $(date +%Y-%m-%d).

          $BODY" || true
          else
            gh issue create -R "${{ github.repository }}" \
              --title "$TITLE ($(date +%Y-%m-%d))" --body "$BODY" || true
          fi

      - name: Mark the run failed when a human is needed
        if: steps.rebase.outputs.status == 'conflict' || steps.rebase.outputs.status == 'needs-token'
        run: |
          echo "::error::Upstream update needs attention (${{ steps.rebase.outputs.status }}) -- see the open issue."
          exit 1
